<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 486" width="880" role="img">
<title>@glrodasz/components system context (C4 level 1)</title>
<desc>The maintainer builds the UI kit live on stream and a front-end developer installs it and browses its Storybook. The kit publishes releases to npm, deploys its Storybook to Vercel and publishes visual snapshots to Chromatic; the RETO web app, cero-web, uses its components.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
<marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
</defs>

<g class="s-gray">
<rect x="120" y="30" width="240" height="64" rx="32"/>
<text class="th" x="240" y="52" text-anchor="middle" dominant-baseline="central">Maintainer</text>
<text class="ts" x="240" y="72" text-anchor="middle" dominant-baseline="central">builds it live on stream</text>
</g>
<g class="s-gray">
<rect x="520" y="30" width="240" height="64" rx="32"/>
<text class="th" x="640" y="52" text-anchor="middle" dominant-baseline="central">Front-end developer</text>
<text class="ts" x="640" y="72" text-anchor="middle" dominant-baseline="central">builds RETO screens</text>
</g>

<g class="s-purple">
<rect x="240" y="190" width="400" height="90" rx="10"/>
<text class="tm" x="440" y="214" text-anchor="middle" dominant-baseline="central">@glrodasz/components</text>
<text class="ts" x="440" y="240" text-anchor="middle" dominant-baseline="central">React UI kit, Atomic Design</text>
<text class="ts" x="440" y="258" text-anchor="middle" dominant-baseline="central">tokens, atoms, molecules, layout</text>
</g>

<path class="arr" d="M300 94 V188" marker-end="url(#a)"/>
<text class="ts" x="290" y="141" text-anchor="end" dominant-baseline="central">commits components</text>
<path class="arr" d="M580 94 V188" marker-end="url(#a)"/>
<text class="ts" x="590" y="141" dominant-baseline="central">installs, browses Storybook</text>

<g class="s-gray">
<rect x="30" y="400" width="190" height="64" rx="10"/>
<text class="th" x="125" y="422" text-anchor="middle" dominant-baseline="central">npm registry</text>
<text class="ts" x="125" y="442" text-anchor="middle" dominant-baseline="central">versioned package</text>
</g>
<g class="s-gray">
<rect x="240" y="400" width="190" height="64" rx="10"/>
<text class="th" x="335" y="422" text-anchor="middle" dominant-baseline="central">Vercel</text>
<text class="ts" x="335" y="442" text-anchor="middle" dominant-baseline="central">hosts the Storybook</text>
</g>
<g class="s-gray">
<rect x="450" y="400" width="190" height="64" rx="10"/>
<text class="th" x="545" y="422" text-anchor="middle" dominant-baseline="central">Chromatic</text>
<text class="ts" x="545" y="442" text-anchor="middle" dominant-baseline="central">visual review</text>
</g>
<g class="s-teal">
<rect x="660" y="400" width="190" height="64" rx="10"/>
<text class="tm" x="755" y="422" text-anchor="middle" dominant-baseline="central">cero-web</text>
<text class="ts" x="755" y="442" text-anchor="middle" dominant-baseline="central">RETO web app</text>
</g>

<path class="arr" d="M270 280 V330 H125 V398" marker-end="url(#a)"/>
<text class="ts" x="134" y="316" dominant-baseline="central">publishes releases</text>
<path class="arr" d="M380 280 V398" marker-end="url(#a)"/>
<text class="ts" x="372" y="364" text-anchor="end" dominant-baseline="central">deploys Storybook</text>
<path class="arr" d="M500 280 V398" marker-end="url(#a)"/>
<text class="ts" x="508" y="364" dominant-baseline="central">uploads snapshots</text>
<path class="arr" d="M755 400 V330 H610 V282" marker-end="url(#a)"/>
<text class="ts" x="746" y="316" text-anchor="end" dominant-baseline="central">uses components</text>
</svg>
